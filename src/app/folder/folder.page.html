<ion-header class="ion-no-border">
  <ion-toolbar class="main-toolbar">
    <ion-title class="app-title">ARLEKING</ion-title>
    <ion-buttons slot="end">
      <button class="icon-btn" id="menu-tres-puntos">
        <ion-icon name="ellipsis-vertical"></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-popover #menuPopover trigger="menu-tres-puntos" triggerAction="click">
  <ng-template>
    <ion-list lines="none">
      <ion-item>
        <ion-icon slot="start" [name]="state.modoNoche() ? 'sunny-outline' : 'moon-outline'"></ion-icon>
        <ion-label>{{ state.modoNoche() ? 'Modo Claro' : 'Modo Noche' }}</ion-label>
        <ion-toggle
          slot="end"
          [checked]="state.modoNoche()"
          (ionChange)="state.setModoNoche($event.detail.checked)">
        </ion-toggle>
      </ion-item>

      <ion-item button (click)="irAMetas(menuPopover)">
        <ion-icon slot="start" name="trophy-outline" style="color: #D4AF37;"></ion-icon>
        <ion-label>Mis Metas</ion-label>
      </ion-item>

      <ion-item button (click)="cerrarSesion(menuPopover)">
        <ion-icon slot="start" name="log-out-outline" color="danger"></ion-icon>
        <ion-label color="danger">Cerrar Sesión</ion-label>
      </ion-item>
    </ion-list>
  </ng-template>
</ion-popover>

<ion-content class="dashboard-content">
  <!-- Tarjeta Principal de la Lanza -->
  <div class="card-container sword-main-card" (click)="irADetallePasos()" [class.golden-goal]="esGoalAlcanzado">
    <div class="sword-legend">
      <div class="legend-row">
        <span class="dot" [class.cyan]="state.pasosActuales() > 0"></span>
        <span><b>{{ state.pasosActuales() | number }}</b> Pasos</span>
      </div>
      <div class="legend-row">
        <span class="dot" [class.pink]="state.caloriasActuales() > 0"></span>
        <span><b>{{ state.caloriasActuales() }}</b> Calorías</span>
      </div>
      <div class="legend-row">
        <span class="dot" [class.purple]="state.tiempoActivoMins() > 0"></span>
        <span><b>{{ state.tiempoActivoMins() }}</b> mins</span>
      </div>
    </div>

    <div class="sword-wrapper">
      <svg class="arleking-sword-svg" viewBox="0 0 100 240" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Mango: Morado solo si hay minutos activos -->
        <rect x="43" y="130" width="14" height="90"
          class="sword-handle"
          [class.active-purple]="state.tiempoActivoMins() > 0" />
        <!-- Guarda: Rosa solo si hay calorías quemadas -->
        <path d="M 50 70 Q 65 95 85 105 Q 65 115 50 140 Q 35 115 15 105 Q 35 95 50 70 Z"
          class="sword-guard"
          [class.active-pink]="state.caloriasActuales() > 0" />
        <!-- Gema central -->
        <circle cx="50" cy="105" r="8.5"
          class="sword-gem"
          [class.active-gem]="state.pasosActuales() > 0" />
        <!-- Punta de lanza: Cyan solo si hay pasos -->
        <path d="M 50 15 L 75 45 L 75 80 L 25 80 L 25 45 Z"
          class="sword-blade"
          [class.active-cyan]="state.pasosActuales() > 0" />
      </svg>
    </div>
  </div>

  <!-- Contenedor Vertical de Widgets con mismo formato que Ir a Gráficas -->
  <div class="cards-stack">
    <!-- 1. Pasos -->
    <button type="button" class="card-container widget-card nav-style-card steps-card" (click)="irADetallePasos()">
      <div class="widget-info">
        <div class="widget-title-row">
          <ion-icon name="footsteps-outline" class="widget-icon icon-steps"></ion-icon>
          <span class="widget-title">Pasos · <b>{{ state.pasosActuales() | number }}</b></span>
        </div>
        <span class="widget-subtitle">Meta diaria: {{ state.pasosMetaDiaria() | number }} pasos · {{ state.distanciaKm() }} km</span>
      </div>

      <div class="widget-right-group">
        <div class="steps-progress-bar">
          <div class="progress-fill" [style.width.%]="(state.pasosActuales() / state.pasosMetaDiaria()) * 100"></div>
        </div>
        <ion-icon name="chevron-forward-outline" class="card-chevron"></ion-icon>
      </div>
    </button>

    <!-- 2. Ritmo Cardíaco -->
    <button type="button" class="card-container widget-card nav-style-card heart-card" (click)="irACorazon()">
      <div class="widget-info">
        <div class="widget-title-row">
          <ion-icon name="heart-outline" class="widget-icon icon-heart"></ion-icon>
          <span class="widget-title">Ritmo Cardíaco</span>
        </div>
        <span class="widget-subtitle">Último registro: {{ state.ritmoCardiaco() ?? '--' }} LPM</span>
      </div>

      <div class="widget-right-group">
        <span class="heart-pill">
          {{ state.ritmoCardiaco() ? (state.ritmoCardiaco() + ' LPM') : 'Registrar' }}
        </span>
        <ion-icon name="chevron-forward-outline" class="card-chevron"></ion-icon>
      </div>
    </button>

    <!-- 3. Horas de Sueño -->
    <button type="button" class="card-container widget-card nav-style-card sleep-card" (click)="irASueno()">
      <div class="widget-info">
        <div class="widget-title-row">
          <ion-icon name="bed-outline" class="widget-icon icon-sleep"></ion-icon>
          <span class="widget-title">Horas de sueño</span>
        </div>
        <span class="widget-subtitle">{{ state.horasSueno() }} Hrs dormidas de {{ state.horasSuenoMeta }} Hrs</span>
      </div>

      <div class="widget-right-group">
        <div class="sleep-progress-bar">
          <div class="sleep-fill" [style.width.%]="(state.horasSueno() / state.horasSuenoMeta) * 100"></div>
        </div>
        <ion-icon name="chevron-forward-outline" class="card-chevron"></ion-icon>
      </div>
    </button>

    <!-- 4. Ir a Gráficas -->
    <button type="button" class="card-container widget-card nav-style-card graficas-nav-card" (click)="irAGraficas()">
      <div class="widget-info">
        <div class="widget-title-row">
          <ion-icon name="bar-chart-outline" class="widget-icon graficas-icon"></ion-icon>
          <span class="widget-title">Ir a Graficas</span>
        </div>
        <span class="widget-subtitle">Ver analítica por día, mes y año</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="card-chevron"></ion-icon>
    </button>
  </div>
</ion-content>
